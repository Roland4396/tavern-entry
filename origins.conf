    # Tavern and its login service are stable Docker names, not pinned container IPs.
    upstream tavern_app_origin {
        zone tavern_app_origin 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server sillytavern:28000 resolve;
    }
    upstream tavern_login_origin {
        zone tavern_login_origin 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server auth-gateway:28100 resolve;
    }
