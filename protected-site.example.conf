# Include under http{} together with origins.conf. Internal example; configure TLS separately.
server {
    listen 127.0.0.1:8080;
    server_name tavern.example.invalid;
    location = /__auth {
        internal;
        proxy_pass http://tavern_login_origin/__auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }
    location = /login { proxy_pass http://tavern_login_origin; }
    location = /logout { proxy_pass http://tavern_login_origin; }
    location /assets/ { proxy_pass http://tavern_login_origin; }
    location / {
        auth_request /__auth;
        error_page 401 =302 /login;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_pass http://tavern_app_origin;
    }
}
